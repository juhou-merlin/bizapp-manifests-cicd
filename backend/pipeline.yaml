# ═══════════════════════════════════════════════════════════════════
# バックエンド CI/CD パイプライン（v0.1）
# ═══════════════════════════════════════════════════════════════════
#
# パイプライン概要（v0.1 仕様準拠）:
#   main ブランチ:
#     1. ソースコード取得 (git-clone: OpenShift内蔵Task)
#     2. ビルド＆ユニットテスト (maven-build-test: カスタムTask)
#     3. S2I コンテナイメージビルド (s2i-java-build: カスタムTask)
#     4. マニフェスト更新 (git-update-manifest: カスタムTask)
#
#   main 以外のブランチ:
#     1. ソースコード取得
#     2. ビルド＆ユニットテストのみ（S2I・デプロイは行わない）
#
# 共有可能なTask:
#   - git-clone: OpenShift内蔵ClusterTask（フロントエンドでも同じものを使用）
#   - git-update-manifest: フロントエンドでも同じTaskを使用可能
#
# フロントエンド開発者への注意:
#   このファイルを参考に、フロントエンド用のパイプラインを作成してください。
#   主な変更点:
#     - maven-build-test → npm-build-test に置き換え
#     - s2i-java-build → s2i-nodejs-build に置き換え
#     - git-update-manifest はそのまま流用可能
# ═══════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────
# カスタム Task 1: Maven ビルド＆ユニットテスト
# ─────────────────────────────────────────────────────
# mvn clean package を実行し、ユニットテストとJARパッケージングを同時に行う
# 依存ライブラリは PVC にキャッシュして、パイプライン実行のたびにダウンロードしない
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build-test
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "Maven ビルド＆テスト"
spec:
  description: |
    Maven を使用して Spring Boot アプリケーションのビルドとユニットテストを実行する。
    mvn clean package により、テスト実行と JAR パッケージングを同時に行う。
    .m2/repository を PVC にキャッシュすることで、ビルド時間を短縮する。
  params:
    - name: GOALS
      description: Maven の実行ゴール
      type: string
      default: "clean package"
    - name: MAVEN_IMAGE
      description: Maven 実行用のコンテナイメージ
      type: string
      # v0.1仕様: OpenJDK 25 固定（利用可能になるまで21で代用）
      # 本番では registry.access.redhat.com/ubi9/openjdk-25:latest に変更すること
      default: "registry.access.redhat.com/ubi9/openjdk-21:latest"
  workspaces:
    - name: source
      description: ソースコードが格納されたワークスペース
    - name: maven-cache
      description: Maven リポジトリキャッシュ用ワークスペース（PVC）
  steps:
    - name: mvn-build
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)
      env:
        # キャッシュ用PVCの .m2/repository を Maven ローカルリポジトリとして使用
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=$(workspaces.maven-cache.path)/.m2/repository"
      script: |
        #!/bin/bash
        set -eo pipefail

        echo "========================================="
        echo " Maven ビルド＆ユニットテスト開始"
        echo " ゴール: $(params.GOALS)"
        echo "========================================="

        # Maven Wrapper（mvnw）が存在する場合はそちらを使用
        if [ -f "./mvnw" ]; then
          chmod +x ./mvnw
          ./mvnw -B $(params.GOALS) \
            -Dmaven.repo.local=$(workspaces.maven-cache.path)/.m2/repository
        else
          mvn -B $(params.GOALS) \
            -Dmaven.repo.local=$(workspaces.maven-cache.path)/.m2/repository
        fi

        echo "========================================="
        echo " ビルド＆テスト完了"
        echo "========================================="

---
# ─────────────────────────────────────────────────────
# カスタム Task 2: S2I Java イメージビルド
# ─────────────────────────────────────────────────────
# Red Hat 提供の S2I ランタイムイメージを使用して、
# 前工程でビルド済みの JAR からコンテナイメージを生成する。
# 開発者は Containerfile を記述する必要がない。
#
# v0.1 仕様:
#   - S2I方式: Red Hat提供のビルダーイメージを使用
#   - 前工程の成果物を活用（ソースからの再ビルドは行わない）
#   - OpenJDK 25 固定（変数切り替えは v1.0 で対応）
#
# フロントエンド開発者への注意:
#   Node.js 版の S2I Task を作成する場合は、以下を変更してください:
#   - BUILDER_IMAGE: Node.js 用の S2I イメージに変更
#   - ARTIFACT_COPY: Next.js のビルド成果物（.next/standalone 等）をコピーするように変更
#   - CMD: node server.js に変更
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: s2i-java-build
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "S2I Java イメージビルド"
spec:
  description: |
    S2I（Source-to-Image）方式でコンテナイメージをビルドする。
    Red Hat 提供の OpenJDK ランタイムイメージをベースに、
    前工程で生成した JAR ファイルを組み込んでイメージを生成する。
    開発者が Containerfile を記述する必要はない。
  params:
    - name: IMAGE
      description: 出力先イメージURL（タグ付き）
      type: string
    - name: BUILDER_IMAGE
      description: Red Hat S2I ランタイムイメージ
      type: string
      # v0.1仕様: OpenJDK 25 固定
      # 利用可能になったら registry.access.redhat.com/ubi9/openjdk-25-runtime:latest に変更
      default: "registry.access.redhat.com/ubi9/openjdk-21-runtime:latest"
    - name: TLSVERIFY
      description: TLS検証の有無（OpenShift内部レジストリはfalse）
      type: string
      default: "false"
  workspaces:
    - name: source
      description: ビルド済みの成果物（JAR）が格納されたワークスペース
  results:
    - name: IMAGE_DIGEST
      description: プッシュしたイメージのダイジェスト値
    - name: IMAGE_URL
      description: プッシュしたイメージのURL
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      env:
        - name: BUILDER_IMAGE
          value: $(params.BUILDER_IMAGE)
        - name: OUTPUT_IMAGE
          value: $(params.IMAGE)
      script: |
        #!/bin/bash
        set -eo pipefail

        echo "========================================="
        echo " S2I イメージビルド開始"
        echo " ビルダーイメージ: ${BUILDER_IMAGE}"
        echo " 出力イメージ: ${OUTPUT_IMAGE}"
        echo "========================================="

        # ── S2Iイメージビルド ──
        # パイプラインが自動的にDockerfileを生成する
        # 開発者が Containerfile を記述する必要はない
        #
        # このDockerfileは S2I ランタイムイメージをベースに、
        # 前工程でビルドした JAR を /deployments/ にコピーする
        # UBI OpenJDK ランタイムイメージは /deployments/ 内の
        # JAR を自動検出して起動する
        cat > /tmp/Dockerfile.s2i << EOF
        FROM ${BUILDER_IMAGE}
        COPY target/*.jar /deployments/
        EXPOSE 8080
        EOF

        echo "--- 自動生成された Dockerfile ---"
        cat /tmp/Dockerfile.s2i
        echo "--- ---"

        # buildah でイメージをビルド
        buildah bud \
          --storage-driver=vfs \
          --format=oci \
          -t "${OUTPUT_IMAGE}" \
          -f /tmp/Dockerfile.s2i \
          .

        # OpenShift 内部レジストリにプッシュ
        buildah push \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          --digestfile=/tmp/digest \
          "${OUTPUT_IMAGE}" \
          "docker://${OUTPUT_IMAGE}"

        # 結果を出力
        IMAGE_DIGEST=$(cat /tmp/digest)
        echo -n "${IMAGE_DIGEST}" | tee $(results.IMAGE_DIGEST.path)
        echo -n "${OUTPUT_IMAGE}" | tee $(results.IMAGE_URL.path)

        echo ""
        echo "========================================="
        echo " イメージビルド＆プッシュ完了"
        echo " ダイジェスト: ${IMAGE_DIGEST}"
        echo "========================================="

---
# ─────────────────────────────────────────────────────
# カスタム Task 3: マニフェストリポジトリ更新
# ─────────────────────────────────────────────────────
# GitOps のマニフェストリポジトリにあるイメージタグを更新し、
# 変更をプッシュする。ArgoCD がこの変更を検知して自動デプロイする。
#
# このTaskはフロントエンドパイプラインでもそのまま使用可能。
# APP_NAME パラメータを変更するだけで、バックエンド/フロントエンドの
# イメージタグを個別に更新できる。
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-update-manifest
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "マニフェスト更新"
spec:
  description: |
    マニフェストリポジトリの .argocd-source.yaml を更新し、
    新しいイメージタグをプッシュする。
    ArgoCD がこの変更を検知してOpenShiftへの自動デプロイを実行する。
    バックエンド・フロントエンドの両方で共用可能。
  params:
    - name: GIT_REPOSITORY
      description: マニフェストリポジトリのURL
      type: string
    - name: APP_NAME
      description: アプリケーション名（backend または frontend）
      type: string
    - name: IMAGE_TAG
      description: 新しいイメージタグ（通常はコミットSHA）
      type: string
    - name: KUSTOMIZATION_PATH
      description: kustomization.yaml が配置されたディレクトリ
      type: string
      default: "overlays/dev"
    - name: IMAGE_REGISTRY
      description: コンテナイメージレジストリのURL
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/bizapp"
    - name: GIT_CREDENTIALS_SECRET
      description: GitHub push 用 Secret 名
      type: string
      default: "github-credentials"
  workspaces:
    - name: source
      description: 作業用ワークスペース
  steps:
    # ステップ 1: マニフェストリポジトリをクローン
    - name: git-clone
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: GIT_USERNAME
          valueFrom:
            secretKeyRef:
              name: $(params.GIT_CREDENTIALS_SECRET)
              key: username
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.GIT_CREDENTIALS_SECRET)
              key: token
      script: |
        #!/bin/bash
        set -eo pipefail

        echo "マニフェストリポジトリをクローン中..."

        # ワークスペースをクリア（前回の実行の残りを削除）
        rm -rf .git .[!.]* ..?* * 2>/dev/null || true

        AUTH_REPOSITORY="$(params.GIT_REPOSITORY)"
        AUTH_REPOSITORY="${AUTH_REPOSITORY/https:\/\//https://${GIT_USERNAME}:${GIT_TOKEN}@}"

        git clone "${AUTH_REPOSITORY}" .
        git config user.email "pipeline@openshift.local"
        git config user.name "Tekton Pipeline"
        git remote set-url origin "${AUTH_REPOSITORY}"

    # ステップ 2: イメージタグを更新
    - name: update-image-tag
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eo pipefail

        ARGOCD_SOURCE="$(params.KUSTOMIZATION_PATH)/.argocd-source.yaml"
        IMAGE_NAME="bizapp-$(params.APP_NAME)"
        FULL_IMAGE="$(params.IMAGE_REGISTRY)/${IMAGE_NAME}:$(params.IMAGE_TAG)"

        echo "========================================="
        echo " マニフェスト更新"
        echo " 対象ファイル: ${ARGOCD_SOURCE}"
        echo " アプリ: $(params.APP_NAME)"
        echo " 新イメージ: ${FULL_IMAGE}"
        echo "========================================="

        # .argocd-source.yaml のイメージタグを更新
        # sed で該当行のイメージタグを新しい値に置換する
        sed -i "s|${IMAGE_NAME}=.*|${IMAGE_NAME}=${FULL_IMAGE}|" "${ARGOCD_SOURCE}"

        echo "--- 更新後の .argocd-source.yaml ---"
        cat "${ARGOCD_SOURCE}"
        echo "--- ---"

    # ステップ 3: 変更をコミット＆プッシュ
    - name: git-push
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel8:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -eo pipefail

        # 変更がある場合のみコミット
        if git diff --quiet; then
          echo "変更なし。プッシュをスキップします。"
          exit 0
        fi

        git add -A
        git commit -m "ci($(params.APP_NAME)): イメージタグを $(params.IMAGE_TAG) に更新"
        git push origin main

        echo "マニフェスト更新をプッシュしました。"
        echo "ArgoCD が変更を検知して自動デプロイを開始します。"

---
# ═══════════════════════════════════════════════════════════════════
# パイプライン定義: バックエンド CI/CD
# ═══════════════════════════════════════════════════════════════════
#
# ブランチ戦略（v0.1 仕様）:
#   main ブランチ:
#     git-clone → maven-build-test → s2i-java-build → git-update-manifest
#   main 以外:
#     git-clone → maven-build-test のみ（when 式で制御）
#
# 使用するTask:
#   - git-clone: OpenShift Pipelines 内蔵の ClusterTask
#     resolver: cluster で参照（フロントエンドでも同じものを使用可能）
#   - maven-build-test: 上記で定義したカスタム Task
#   - s2i-java-build: 上記で定義したカスタム Task
#   - git-update-manifest: 上記で定義したカスタム Task（フロントエンドでも流用可能）
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: backend-pipeline
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "バックエンド CI/CD パイプライン"
spec:
  description: |
    バックエンド（Spring Boot）のCI/CDパイプライン。
    v0.1仕様に基づき、ビルド・テスト・S2Iイメージビルド・デプロイを実行する。

  # ── パイプラインパラメータ ──
  params:
    - name: git-url
      description: バックエンドソースコードリポジトリのURL
      type: string
      default: "https://github.com/juhou-merlin/bizapp-backend.git"
    - name: git-revision
      description: ビルド対象のGitリビジョン（ブランチ名 or コミットSHA）
      type: string
      default: "main"
    - name: git-ref
      description: "Push イベントのGit参照（例: refs/heads/main）"
      type: string
      default: "refs/heads/main"
    - name: image-name
      description: 出力先コンテナイメージ名（タグなし）
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/bizapp/bizapp-backend"
    - name: git-url-manifests
      description: アプリ用マニフェストリポジトリ（manifests-app）のURL
      type: string
      default: "https://github.com/juhou-merlin/bizapp-manifests-app.git"

  # ── ワークスペース ──
  workspaces:
    - name: shared-workspace
      description: ソースコードとビルド成果物を共有するワークスペース
    - name: maven-cache
      description: Maven 依存ライブラリのキャッシュ用ワークスペース（PVC）

  # ── タスク定義 ──
  tasks:
    # ──────────────────────────────────
    # ステップ 1: ソースコード取得
    # ──────────────────────────────────
    # OpenShift Pipelines 内蔵の git-clone ClusterTask を使用
    # resolver: cluster で OpenShift にプリインストールされたTaskを参照する
    # フロントエンドパイプラインでも同じ方法で git-clone を使用できる
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"

    # ──────────────────────────────────
    # ステップ 2: ビルド＆ユニットテスト
    # ──────────────────────────────────
    # mvn clean package でユニットテストとJARパッケージングを同時実行
    # 依存ライブラリは PVC にキャッシュされる
    - name: build-and-test
      runAfter:
        - fetch-source
      taskRef:
        name: maven-build-test
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: maven-cache
          workspace: maven-cache
      params:
        - name: GOALS
          value: "clean package"

    # ──────────────────────────────────
    # ステップ 3: S2I コンテナイメージビルド
    # ──────────────────────────────────
    # main ブランチの場合のみ実行（when 式で制御）
    # main 以外のブランチではこのステップはスキップされる
    #
    # S2I ランタイムイメージを使用して、前工程でビルドした
    # JAR をコンテナイメージに組み込む
    - name: build-image
      runAfter:
        - build-and-test
      when:
        - input: "$(params.git-ref)"
          operator: in
          values: ["main", "refs/heads/main"]
      taskRef:
        name: s2i-java-build
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.image-name):$(tasks.fetch-source.results.COMMIT)"

    # ──────────────────────────────────
    # ステップ 4: マニフェスト更新（GitOps）
    # ──────────────────────────────────
    # main ブランチの場合のみ実行
    # マニフェストリポジトリのイメージタグを更新し、
    # ArgoCD による自動デプロイをトリガーする
    #
    # このTaskはフロントエンドでもそのまま流用可能
    # APP_NAME を "frontend" に変更するだけでよい
    - name: update-manifest
      runAfter:
        - build-image
      when:
        - input: "$(params.git-ref)"
          operator: in
          values: ["main", "refs/heads/main"]
      taskRef:
        name: git-update-manifest
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: GIT_REPOSITORY
          value: $(params.git-url-manifests)
        - name: APP_NAME
          value: "backend"
        - name: IMAGE_TAG
          value: "$(tasks.fetch-source.results.COMMIT)"
