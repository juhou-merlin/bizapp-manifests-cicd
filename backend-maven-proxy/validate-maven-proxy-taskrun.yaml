apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: maven-proxy-settings-validation
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
spec:
  taskSpec:
    volumes:
      - name: maven-proxy-settings
        configMap:
          name: maven-proxy-settings
          items:
            - key: settings.xml
              path: settings.xml
    steps:
      - name: validate
        image: registry.access.redhat.com/ubi9/openjdk-21:latest
        volumeMounts:
          - name: maven-proxy-settings
            mountPath: /etc/maven-proxy
            readOnly: true
        script: |
          #!/bin/bash
          set -euo pipefail

          mkdir -p /tmp/maven-proxy-validation /tmp/maven-proxy-m2
          cd /tmp/maven-proxy-validation

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>proxy.validation</groupId>
            <artifactId>maven-proxy-settings-validation</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency>
                <groupId>org.apache.commons</groupId>
                <artifactId>commons-lang3</artifactId>
                <version>3.14.0</version>
              </dependency>
            </dependencies>
          </project>
          EOF

          mvn -B -ntp \
            -s /etc/maven-proxy/settings.xml \
            -Dmaven.repo.local=/tmp/maven-proxy-m2 \
            dependency:resolve

          test -f /tmp/maven-proxy-m2/org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar
          echo MAVEN_PROXY_SETTINGS_VALIDATION_SUCCEEDED
