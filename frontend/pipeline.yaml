# ═══════════════════════════════════════════════════════════════════
# フロントエンド CI/CD パイプライン（v0.1）— 正解例
# ═══════════════════════════════════════════════════════════════════
#
# パイプライン概要（v0.1 仕様準拠）:
#   main ブランチ:
#     1. ソースコード取得 (git-clone: OpenShift内蔵Task)
#     2. ビルド＆ユニットテスト (npm-build-test: カスタムTask)
#     3. S2I コンテナイメージビルド (s2i-nodejs-build: カスタムTask)
#     4. マニフェスト更新 (git-update-manifest: バックエンドと共用)
#
#   main 以外のブランチ:
#     1. ソースコード取得
#     2. ビルド＆ユニットテストのみ（S2I・デプロイは行わない）
#
# バックエンドとの共用Task:
#   - git-clone: OpenShift内蔵ClusterTask（バックエンドと同一）
#   - git-update-manifest: バックエンドで定義済みのカスタムTask をそのまま流用
#     APP_NAME パラメータを "frontend" に変更するだけでよい
#
# バックエンドからの変更点:
#   - maven-build-test → npm-build-test に置き換え
#   - s2i-java-build → s2i-nodejs-build に置き換え
#   - maven-cache → npm-cache に変更
# ═══════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────
# カスタム Task 1: npm ビルド＆ユニットテスト
# ─────────────────────────────────────────────────────
# npm ci でパッケージをインストールし、npm run build でビルド、
# npm run test でユニットテストを実行する
# npm キャッシュは PVC に保存して、パイプライン実行のたびにダウンロードしない
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm-build-test
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "npm ビルド＆テスト"
spec:
  description: |
    npm を使用して Next.js アプリケーションのビルドとユニットテストを実行する。
    npm ci で依存関係をインストールし、npm run build でビルド、
    npm run test でテストを実行する。
    npm キャッシュを PVC に保存することで、ビルド時間を短縮する。
  params:
    - name: NODE_IMAGE
      description: Node.js 実行用のコンテナイメージ
      type: string
      # v0.1仕様: Node.js 24 固定（利用可能になるまで20で代用）
      # 本番では registry.access.redhat.com/ubi9/nodejs-24:latest に変更すること
      default: "registry.access.redhat.com/ubi9/nodejs-20:latest"
  workspaces:
    - name: source
      description: ソースコードが格納されたワークスペース
    - name: npm-cache
      description: npm パッケージキャッシュ用ワークスペース（PVC）
  steps:
    - name: npm-install-build-test
      image: $(params.NODE_IMAGE)
      workingDir: $(workspaces.source.path)/source
      env:
        # npm キャッシュディレクトリを PVC 上に設定
        - name: npm_config_cache
          value: "$(workspaces.npm-cache.path)/.npm"
      script: |
        #!/bin/bash
        set -eo pipefail

        echo "========================================="
        echo " npm ビルド＆ユニットテスト開始"
        echo "========================================="

        # npm キャッシュディレクトリを作成
        mkdir -p "${npm_config_cache}"

        # 依存パッケージをインストール（キャッシュ利用）
        echo "--- npm ci: 依存パッケージのインストール ---"
        npm ci --cache "${npm_config_cache}"

        # プロダクションビルド
        echo "--- npm run build: プロダクションビルド ---"
        npm run build

        # ユニットテスト実行
        echo "--- npm run test: ユニットテスト ---"
        npm run test

        echo "========================================="
        echo " ビルド＆テスト完了"
        echo "========================================="

---
# ─────────────────────────────────────────────────────
# カスタム Task 2: S2I Node.js イメージビルド
# ─────────────────────────────────────────────────────
# Red Hat 提供の Node.js ランタイムイメージを使用して、
# 前工程でビルド済みの Next.js 成果物からコンテナイメージを生成する。
# 開発者は Containerfile を記述する必要がない。
#
# v0.1 仕様:
#   - S2I方式: Red Hat提供のビルダーイメージを使用
#   - 前工程の成果物を活用（ソースからの再ビルドは行わない）
#   - Node.js 24 固定（変数切り替えは v1.0 で対応）
#
# Next.js standalone モードについて:
#   next.config.mjs で output: 'standalone' を設定すると、
#   .next/standalone/ に独立実行可能なサーバーが生成される。
#   このサーバーは node server.js で起動できる。
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: s2i-nodejs-build
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "S2I Node.js イメージビルド"
spec:
  description: |
    S2I（Source-to-Image）方式でコンテナイメージをビルドする。
    Red Hat 提供の Node.js ランタイムイメージをベースに、
    前工程で生成した Next.js ビルド成果物を組み込んでイメージを生成する。
    開発者が Containerfile を記述する必要はない。
  params:
    - name: IMAGE
      description: 出力先イメージURL（タグ付き）
      type: string
    - name: BUILDER_IMAGE
      description: Red Hat S2I Node.js ランタイムイメージ
      type: string
      # v0.1仕様: Node.js 24 固定
      # 利用可能になったら registry.access.redhat.com/ubi9/nodejs-24-minimal:latest に変更
      default: "registry.access.redhat.com/ubi9/nodejs-20-minimal:latest"
    - name: TLSVERIFY
      description: TLS検証の有無（OpenShift内部レジストリはfalse）
      type: string
      default: "false"
  workspaces:
    - name: source
      description: ビルド済みの成果物（.next/standalone 等）が格納されたワークスペース
  results:
    - name: IMAGE_DIGEST
      description: プッシュしたイメージのダイジェスト値
    - name: IMAGE_URL
      description: プッシュしたイメージのURL
  steps:
    - name: build-and-push
      image: registry.access.redhat.com/ubi9/buildah:latest
      workingDir: $(workspaces.source.path)/source
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      env:
        - name: BUILDER_IMAGE
          value: $(params.BUILDER_IMAGE)
        - name: OUTPUT_IMAGE
          value: $(params.IMAGE)
      script: |
        #!/bin/bash
        set -eo pipefail

        echo "========================================="
        echo " S2I Node.js イメージビルド開始"
        echo " ビルダーイメージ: ${BUILDER_IMAGE}"
        echo " 出力イメージ: ${OUTPUT_IMAGE}"
        echo "========================================="

        # ── S2Iイメージビルド ──
        # パイプラインが自動的にDockerfileを生成する
        # 開発者が Containerfile を記述する必要はない
        #
        # Next.js の standalone モード出力を Node.js ランタイムイメージに組み込む
        # .next/standalone/ : 独立実行可能なサーバー（node server.js で起動）
        # .next/static/     : 静的ファイル（CSS/JS等）
        # public/           : 公開静的ファイル（favicon等）
        cat > /tmp/Dockerfile.s2i << EOF
        FROM ${BUILDER_IMAGE}
        COPY .next/standalone/ /opt/app-root/src/
        COPY .next/static/ /opt/app-root/src/.next/static/
        COPY public/ /opt/app-root/src/public/
        EXPOSE 8080
        ENV PORT=8080
        ENV HOSTNAME=0.0.0.0
        CMD ["node", "server.js"]
        EOF

        echo "--- 自動生成された Dockerfile ---"
        cat /tmp/Dockerfile.s2i
        echo "--- ---"

        # buildah でイメージをビルド
        buildah bud \
          --storage-driver=vfs \
          --format=oci \
          -t "${OUTPUT_IMAGE}" \
          -f /tmp/Dockerfile.s2i \
          .

        # OpenShift 内部レジストリにプッシュ
        buildah push \
          --storage-driver=vfs \
          --tls-verify=$(params.TLSVERIFY) \
          --digestfile=/tmp/digest \
          "${OUTPUT_IMAGE}" \
          "docker://${OUTPUT_IMAGE}"

        # 結果を出力
        IMAGE_DIGEST=$(cat /tmp/digest)
        echo -n "${IMAGE_DIGEST}" | tee $(results.IMAGE_DIGEST.path)
        echo -n "${OUTPUT_IMAGE}" | tee $(results.IMAGE_URL.path)

        echo ""
        echo "========================================="
        echo " イメージビルド＆プッシュ完了"
        echo " ダイジェスト: ${IMAGE_DIGEST}"
        echo "========================================="

---
# ═══════════════════════════════════════════════════════════════════
# パイプライン定義: フロントエンド CI/CD
# ═══════════════════════════════════════════════════════════════════
#
# ブランチ戦略（v0.1 仕様）:
#   main ブランチ:
#     git-clone → npm-build-test → s2i-nodejs-build → git-update-manifest
#   main 以外:
#     git-clone → npm-build-test のみ（when 式で制御）
#
# 使用するTask:
#   - git-clone: OpenShift Pipelines 内蔵の ClusterTask（バックエンドと共用）
#   - npm-build-test: 上記で定義したカスタム Task
#   - s2i-nodejs-build: 上記で定義したカスタム Task
#   - git-update-manifest: バックエンドで定義済みのカスタム Task（共用）
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: frontend-pipeline
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
  annotations:
    tekton.dev/displayName: "フロントエンド CI/CD パイプライン"
spec:
  description: |
    フロントエンド（Next.js）のCI/CDパイプライン。
    v0.1仕様に基づき、ビルド・テスト・S2Iイメージビルド・デプロイを実行する。

  # ── パイプラインパラメータ ──
  params:
    - name: git-url
      description: フロントエンドソースコードリポジトリのURL
      type: string
      default: "https://github.com/juhou-merlin/bizapp-frontend.git"
    - name: git-revision
      description: ビルド対象のGitリビジョン（ブランチ名 or コミットSHA）
      type: string
      default: "main"
    - name: git-ref
      description: "Push イベントのGit参照（例: refs/heads/main）"
      type: string
      default: "refs/heads/main"
    - name: image-name
      description: 出力先コンテナイメージ名（タグなし）
      type: string
      default: "image-registry.openshift-image-registry.svc:5000/bizapp/bizapp-frontend"
    - name: git-url-manifests
      description: アプリ用マニフェストリポジトリ（manifests-app）のURL
      type: string
      default: "https://github.com/juhou-merlin/bizapp-manifests-app.git"

  # ── ワークスペース ──
  workspaces:
    - name: shared-workspace
      description: ソースコードとビルド成果物を共有するワークスペース
    - name: npm-cache
      description: npm パッケージキャッシュ用ワークスペース（PVC）

  # ── タスク定義 ──
  tasks:
    # ──────────────────────────────────
    # ステップ 1: ソースコード取得
    # ──────────────────────────────────
    # OpenShift Pipelines 内蔵の git-clone ClusterTask を使用（バックエンドと同一）
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
        - name: SUBDIRECTORY
          value: "source"
        - name: DELETE_EXISTING
          value: "true"

    # ──────────────────────────────────
    # ステップ 2: ビルド＆ユニットテスト
    # ──────────────────────────────────
    # npm ci でインストール → npm run build → npm run test
    # npm キャッシュは PVC に保存される
    - name: build-and-test
      runAfter:
        - fetch-source
      taskRef:
        name: npm-build-test
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: npm-cache
          workspace: npm-cache

    # ──────────────────────────────────
    # ステップ 3: S2I コンテナイメージビルド
    # ──────────────────────────────────
    # main ブランチの場合のみ実行（when 式で制御）
    # Next.js standalone 成果物を Node.js ランタイムイメージに組み込む
    - name: build-image
      runAfter:
        - build-and-test
      when:
        - input: "$(params.git-ref)"
          operator: in
          values: ["main", "refs/heads/main"]
      taskRef:
        name: s2i-nodejs-build
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: "$(params.image-name):$(tasks.fetch-source.results.COMMIT)"

    # ──────────────────────────────────
    # ステップ 4: マニフェスト更新（GitOps）
    # ──────────────────────────────────
    # main ブランチの場合のみ実行
    # バックエンドで定義済みの git-update-manifest Task を共用
    # APP_NAME を "frontend" に変更するだけ
    - name: update-manifest
      runAfter:
        - build-image
      when:
        - input: "$(params.git-ref)"
          operator: in
          values: ["main", "refs/heads/main"]
      taskRef:
        name: git-update-manifest
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: GIT_REPOSITORY
          value: $(params.git-url-manifests)
        - name: APP_NAME
          value: "frontend"
        - name: IMAGE_TAG
          value: "$(tasks.fetch-source.results.COMMIT)"
        - name: GIT_CREDENTIALS_SECRET
          value: "github-credentials"
        - name: IMAGE_REGISTRY
          value: "image-registry.openshift-image-registry.svc:5000/bizapp"
