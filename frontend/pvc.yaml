# ─────────────────────────────────────────────────────
# フロントエンドパイプライン用 PersistentVolumeClaim
# ─────────────────────────────────────────────────────
# npm パッケージキャッシュを永続化するための PVC
# パイプライン実行のたびに外部からダウンロードが発生しないようにする
#
# v0.1仕様: フロントエンド（npm）のライブラリキャッシュ
#
# バックエンドの maven-cache-pvc と同じ構成

# --- npm パッケージキャッシュ用 PVC ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm-cache-pvc
  labels:
    app.kubernetes.io/part-of: bizapp-cicd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # npm パッケージキャッシュ + Next.js ビルド成果物に十分なサイズ
      storage: 5Gi
